[package]
name = "guardener"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["SuiFlex"]
repository = "https://github.com/suiflex/Guardener"
description = "Runs the suiflex engineering standard across the organization's repositories"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
ureq = { version = "3.1", features = ["json"] }
forgeguard-core = { git = "https://github.com/suiflex/ForgeGuard", tag = "v0.14.0" }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
