# Guardener gates itself.
#
# The reference is local rather than `suiflex/Guardener/...@main`, so a change
# to the gate is tested by the pull request that makes it instead of only after
# it has already landed on main.
name: Guardener

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  forgeguard:
    if: github.repository_owner == 'suiflex'
    uses: ./.github/workflows/check.yml
    secrets:
      app_id: ${{ secrets.GUARDENER_BOT_APP_ID }}
      private_key: ${{ secrets.GUARDENER_BOT_PRIVATE_KEY }}
