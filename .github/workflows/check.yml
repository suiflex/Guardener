# The scanning half of the ForgeGuard gate, run on a pull request in any
# repository the organization watches. Repositories call this; they do not copy
# it.
#
# pull_request, and no secrets. This job checks out the pull request's own
# branch, so on a fork it holds code its author controls — which is safe here
# only because there is nothing in the job worth reaching. It has a read-only
# token, no app credentials, and it writes its result to an artifact rather than
# to GitHub. The half that holds credentials is report.yml, and that one never
# checks the branch out.
#
# It used to be one job on pull_request_target, holding the app's private key
# beside a fork's checkout, and safe only for as long as nobody added a step
# that ran something from `subject/`. Then checkout v7 began refusing that
# combination outright and every outside contributor's pull request failed at
# the checkout, before a line was read. Splitting it makes the guarantee
# structural instead of a comment asking to be obeyed.
#
# Do not add secrets to this file, and do not give this job write permissions.
name: Guardener scan

on:
  workflow_call:
    # Accepted and never referenced, so that a repository still carrying the
    # one-workflow stub fails on the guard below — which says what to do —
    # rather than on an unknown-secret error, which does not. A workflow_call
    # secret reaches the job only where the job names it, and no step here names
    # one.
    #
    # Delete these once every watched repository is on the two-workflow stub.
    secrets:
      app_id:
        required: false
      private_key:
        required: false
      model_url:
        required: false
      model_key:
        required: false
      model:
        required: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # A repository still on the one-workflow stub calls this from
      # pull_request_target, where the checkout below would take the base branch
      # instead of the pull request and report "no findings" for every change.
      # Failing here is loud and says what to fix; scanning the wrong tree is
      # silent and says a pull request is clean when nothing read it.
      - name: Refuse a trigger this half cannot serve
        if: github.event_name != 'pull_request'
        run: |
          echo "The gate is in two halves now, and this one runs on pull_request." >&2
          echo "Update .github/workflows/guardener.yml to trigger on pull_request" >&2
          echo "and drop its secrets, then add guardener-report.yml beside it." >&2
          echo "Both templates live in suiflex/Guardener/templates/workflows/." >&2
          exit 1

      # The branch under analysis, and the tool, in separate directories.
      # Nesting the tool inside the checkout would put Guardener's own source
      # under the scanner's root, which is confusing to read even though the
      # changed-line scope would never report it.
      #
      # Full history because the gate measures the pull request against its
      # merge base, not against its tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: subject
          fetch-depth: 0
          persist-credentials: false

      # A fork does not carry the base branch, so fetch it explicitly and let
      # the gate resolve the merge base from FETCH_HEAD. Same path for a branch
      # in this repository, so there is only one thing to get wrong.
      - name: Fetch the base branch
        working-directory: subject
        run: |
          git remote add guardener-base "https://github.com/${{ github.repository }}"
          git fetch --no-tags --depth=200 guardener-base \
            "${{ github.event.pull_request.base.ref }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: suiflex/Guardener
          path: tool
          persist-credentials: false

      # The commit matters more than usual here. This action keeps one branch
      # per toolchain and each branch hardcodes its own version, so a commit
      # taken from the `1.78.0` branch installs 1.78.0 no matter what the
      # comment beside it says — which is how this workflow first failed, on a
      # cargo too old for a dependency's edition. This commit is the head of
      # `stable`, whose `toolchain` input exists and defaults to stable; it is
      # passed explicitly below so the version is readable here rather than
      # inferred from a hash.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: tool

      # Built from source rather than downloaded. Two repositories are watched
      # today and the build is cached; publish release binaries when the wait
      # starts costing more than the release plumbing would.
      - name: Build Guardener
        working-directory: tool
        run: cargo build --release --locked

      # No token: `--findings-out` is the mode that reports nothing and asks for
      # no credentials. The scan itself is a tree-sitter parse, and `--untrusted`
      # turns off ForgeGuard's configured quality commands — shell commands read
      # from the checkout's own configuration — for every branch from outside
      # the organization. Do not add a step that runs the checkout's scripts,
      # and do not drop the untrusted flag.
      - name: Run the gate
        env:
          # True for every branch that is not in this repository. Read from the
          # event rather than from the checkout, which a fork controls.
          UNTRUSTED: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$UNTRUSTED" = "true" ]; then set -- --untrusted; else set --; fi
          tool/target/release/guardener check \
            --root subject \
            --registry tool/config/repositories.toml \
            --organization-default tool/config/forgeguard.toml \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base FETCH_HEAD \
            --findings-out findings/findings.json \
            "$@"

      # The pull request number rides along in its own file. report.yml is woken
      # by workflow_run, whose payload names the workflow and the commit but not
      # the pull request, and asking the API for it is a lookup that can answer
      # with more than one.
      #
      # Only the number. Everything else the reporting half needs — which
      # repository, which commit — it takes from its own event, so that a fork
      # cannot aim the result somewhere else by writing a different file here.
      - name: Record the pull request number
        run: echo "${{ github.event.pull_request.number }}" > findings/pr-number

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guardener-findings
          path: findings/
          retention-days: 1
